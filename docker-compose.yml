# HAI TANG trong mot file, tach nhau bang `profiles`.
#
# Tang 1 - DASHBOARD (mac dinh): PostgreSQL + pgAdmin. Khong doi gi so voi truoc.
#
#     docker compose up -d
#     docker compose logs -f postgres     # xem log
#     docker compose down                 # dung, GIU du lieu
#     docker compose down -v              # dung va XOA sach du lieu
#
#     Postgres   localhost:5432
#     pgAdmin    http://localhost:5050
#
# Tang 2 - API GATEWAY (chi len khi goi ten profile): redis primary + replica,
# 2 instance LiteLLM chay stateless, nginx lam load balancer.
#
#     docker compose --profile gateway up -d
#     docker compose --profile gateway logs -f litellm-1
#     Khong dung profile down cho Gateway-only: no anh huong Dashboard.
#
#     Gateway LB + web http://127.0.0.1:8088 (Host: apigateway.rangdong.com.vn)
#     Node collector   chi loopback ben trong cung container, khong publish 8089
#     Redis             127.0.0.1:6379
#
# `docker compose up -d` KHONG keo Gateway len: dich vu co profile chi chay khi
# goi dung ten profile, hoac goi dich danh ten dich vu.
#
# Vi sao la profile chu khong phai mot file compose thu hai: Gateway ghi so vao
# CHINH may PostgreSQL nay (database rieng ten `litellm`), nen no phai doi
# postgres khoe roi moi len. Hai file compose roi thi khong khai duoc rang buoc do.
#
# Doi cong / mat khau thi dat bien trong file .env (da nam trong .gitignore).
# Khong dat thi dung gia tri mac dinh duoi day - chap nhan duoc vi CHI mo tren
# 127.0.0.1, khong ra mang.

# Xoay vong log. KHONG dat thi Docker dung json-file KHONG GIOI HAN kich thuoc:
# file log lon dan mai cho toi luc day o - ma o do cung dang chua volume pgdata,
# tuc ca token_ledger_v2 lan so Gateway.
#
# 10m x 3 = 30 MB moi container. Dat o khoi dung chung chu khong chep vao tung
# dich vu: 13 dich vu ma chep 13 lan thi lan sau doi se sot. Cung co che neo YAML
# ma `x-litellm` ngay duoi dang dung.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hai instance LiteLLM giong het nhau, tru ten container va cong mo ra ngoai.
# Giong het la CO Y: "stateless" nghia la roi vao may nao cung ra cung ket qua.
# Ba sentinel giong het nhau tru ten container va volume giu cau hinh rieng cua
# tung cai. Moi cai PHAI co volume rieng: Sentinel tu viet lai file cau hinh cua
# no, dung chung mot volume la ba tien trinh giam len nhau.
x-sentinel: &sentinel
  image: redis:7-alpine
  profiles: ["gateway"]
  restart: unless-stopped
  entrypoint: ["sh", "/sentinel-entrypoint.sh"]
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
    SENTINEL_CONF_TEMPLATE: /sentinel.conf.template
    SENTINEL_CONF_PATH: /data/sentinel.conf
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s
  depends_on:
    redis:
      condition: service_healthy
    redis-replica:
      condition: service_healthy

x-litellm: &litellm
  # Image do CI dong goi tu nhanh Tuan-develop cua fork roi day len GHCR, nhan =
  # commit cua fork. Xem job `gateway-image` trong .github/workflows/ci.yml va
  # openspec/changes/package-the-gateway-image-in-ci/. May nao chi co repo nay,
  # khong co fork ben canh, van `pull` va `up` duoc.
  #
  # PHAI LA COMMIT CO BAN VA SENTINEL. Thieu ban va thi LiteLLM CHET ngay luc
  # khoi dong voi
  #     TypeError: Redis.__init__() got multiple values for argument 'host'
  # CI grep _SENTINEL_IGNORED_CONNECTION_ARGS trong litellm/_redis.py TRUOC khi
  # build, nen khong nhan nao tren kho thieu ban va.
  #
  #     repo   git@github.com:ursweetheart/litellm_rang_dong.git
  #     nhanh  Tuan-develop               <- CO ban va, CI build tu nhanh nay
  #     nhanh  litellm_internal_staging   <- KHONG co ban va (f005afa146)
  #
  # Doi phien ban: push fork -> CI build nhan moi -> sua nhan o dong `image:`.
  # CI do neu dong nay ghim mot nhan chua co tren kho, hoac neu
  # docker-compose.bench.yml ghim khac dong nay.
  #
  # Thu mot ban fork dang sua tren may, KHONG sua tep nay:
  #     docker build -t litellm-local ../litellm_tuan_test
  #     roi dat LITELLM_IMAGE=litellm-local trong .env
  image: ${LITELLM_IMAGE:-ghcr.io/ursweetheart/litellm_rang_dong:4373a32c2a2608cdbd732ba47ba057615e5e2846}
  profiles: ["gateway"]
  restart: unless-stopped
  # entrypoint rieng: chan khoi dong khi thieu khoa, roi moi giao lai cho
  # entrypoint that cua image. Xem docker/gateway/entrypoint.sh.
  entrypoint: ["sh", "/gateway-entrypoint.sh"]
  command: ["--config=/app/config.yaml", "--port", "4000"]
  volumes:
    - ./docker/gateway/config.gateway.yaml:/app/config.yaml:ro
    - ./docker/gateway/entrypoint.sh:/gateway-entrypoint.sh:ro
  environment:
    # Database RIENG tren chinh may postgres o duoi. token_ledger phai co DUNG 0
    # bang LiteLLM_* - do la mot phep kiem nghiem thu, khong phai so thich.
    DATABASE_URL: "postgresql://${GATEWAY_PGUSER:-llmproxy}:${GATEWAY_PGPASSWORD:-llmproxy_local}@postgres:5432/${GATEWAY_PGDATABASE:-litellm}"
    STORE_MODEL_IN_DB: "False"
    # Ba bien duoi day KHONG co gia tri mac dinh. Thieu thi entrypoint dung han.
    # Khong dung `${VAR:?}` duoc: compose noi bien cho CA file truoc khi loc
    # profile, nen `:?` se lam `docker compose up -d` cua dashboard gay theo.
    LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
    KEY_GOOGLE_AI_STU: ${KEY_GOOGLE_AI_STU:-}
    # Khoa cua agent Phan Loai Du Lieu CRM (`crm-feedback`, agent 7), dung o che do
    # Vertex express. Tuyen dung no la `gemini-2.5-flash` trong
    # docker/gateway/config.gateway.yaml.
    #
    # DOI TEN HAI LAN, va lan dau da gay su co:
    #   10/09/2026  `KEY_BENCH_CRM_TEST` -> `KEY_BENCH_CRM_TEST_GG_AIA_STU`
    #   17/09/2026  `KEY_BENCH_CRM_TEST_GG_AIA_STU` -> `KEY_CRM_FEEDBACK`
    #
    # BAI HOC TU LAN 10/09, giu nguyen o day vi no van la cach hong: hom do .env doi
    # ten truoc con hai tep con lai giu ten cu, nen `:-` bien khoa thieu thanh CHUOI
    # RONG thay vi mot loi. Container len binh thuong, /health/liveliness tra 200,
    # moi phep kiem dat -- va tuyen CRM chi chet dung luc co nguoi goi that
    # (HTTP 500 "Missing Gemini API key"). Doi ten thi phai doi DU 5 TEP trong CUNG
    # MOT COMMIT; tu 17/09 co phep canh trong nhom `guards` cua CI chan viec nay.
    #
    # Ten moi lay tu `dim_agent.code`, la CUNG chuoi dang lam nhan tren tuyen:
    # tags: ["crm-feedback"]. Ten cu noi sai ba lan -- khoa nay khong phai `BENCH`,
    # khong phai `TEST`, va `GG_AIA_STU` thi nguoc han: do tien to ra `AQ.`, tuc
    # Vertex express chu khong phai AI Studio.
    #
    # Thieu bien nay thi docker/gateway/entrypoint.sh dung han truoc khi LiteLLM
    # khoi dong -- vong kiem trong tep do CO bien nay, da kiem lai 17/09.
    KEY_CRM_FEEDBACK: ${KEY_CRM_FEEDBACK:-}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
    # Dia chi master hoi Sentinel, khong ghim. REDIS_HOST o tren van phai giu:
    # Router chi dung Redis khi co redis_host+redis_port (router.py:565), va
    # ban va trong fork loai `host`/`port` ra khoi sentinel_kwargs nen no khong
    # con gay "multiple values for argument 'host'" nua.
    # Xem litellm/_redis.py: _SENTINEL_IGNORED_CONNECTION_ARGS.
    REDIS_SENTINEL_NODES: '[["sentinel-1", 26379], ["sentinel-2", 26379], ["sentinel-3", 26379]]'
    REDIS_SERVICE_NAME: gateway-redis
    # Muc log INFO, them 08/09/2026. KHONG phai de cho vui.
    #
    # Hom nay bat `enable_redis_auth_cache: true` va KHONG CO GI XAY RA: khoa do
    # chi duoc doc trong hai ham, ca hai deu khong chay voi cau hinh cu. LiteLLM
    # co log dung cho do (proxy_server.py:4006 va 4013, ca nhanh bat va nhanh
    # khong bat) nhung chung o muc INFO, nen o muc mac dinh ta khong thay gi ca
    # va tuong la da xong. Chi khi bat INFO moi doc duoc.
    #
    # Gia phai tra do duoc: 207 dong co noi dung tren mot phien do dai (34 dong
    # trong so do la healthcheck). Log da xoay vong 10m x 3 o `x-logging`.
    # Da kiem 08/09: INFO KHONG in khoa ao, master key, mat khau Redis, header
    # Authorization, hay noi dung prompt -- dem bang grep tren 3.860 dong log.
    LITELLM_LOG: INFO
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\", timeout=3).status == 200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 18
    # Lan dau phai chay `prisma migrate deploy` dung 75 bang -> lau hon han.
    start_period: 90s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    gateway-db-init:
      condition: service_completed_successfully
    # Tu 07/09/2026 LiteLLM hoi Sentinel xem master hien la ai, thay vi tro thang
    # vao `redis`. Nen phai doi sentinel khoe da, khong thi lan khoi dong dau no
    # khong tra ra duoc dia chi master nao.
    sentinel-1:
      condition: service_healthy
    sentinel-2:
      condition: service_healthy
    sentinel-3:
      condition: service_healthy

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-postgres
    restart: unless-stopped
    environment:
      # Must match db/connect.py:75. Before 29/08 this defaulted to
      # `token_ledger` while the code read `token_ledger_v2` -- harmless here
      # since both exist, fatal on a fresh server. Set PGDATABASE in .env.
      POSTGRES_DB: ${PGDATABASE:-token_ledger_v2}
      POSTGRES_USER: ${PGUSER:-token}
      POSTGRES_PASSWORD: ${PGPASSWORD:-token_local}
      # Sap xep theo C cho ket qua ORDER BY on dinh, khong phu thuoc locale may.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Gan vao 127.0.0.1, KHONG phai 0.0.0.0: database nay khong duoc ra mang.
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pgAdmin cho khoe roi moi len, va script chuyen du lieu cung doi cai nay.
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-token} -d ${PGDATABASE:-token_ledger_v2}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pgadmin:
    logging: *logging
    image: dpage/pgadmin4:8
    container_name: token-ledger-pgadmin
    restart: unless-stopped
    environment:
      # PHAI la email dung dinh dang co phan duoi mien. pgAdmin tu chuc nang
      # kiem dinh dang va THOAT neu sai - 'admin@local' bi tu choi, container
      # restart-loop mai ma khong bao gi ra ngoai ngoai log.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_local}
      # Bo man hinh dang nhap master password - day la may cuc bo, khong dang.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      # Khai bao san may chu, khoi phai go tay thong tin ket noi moi lan.
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # DASHBOARD -- no profile, `docker compose up -d` starts it.
  # http://127.0.0.1:8080
  # ==========================================================================

  # Creates the read-only role. Not /docker-entrypoint-initdb.d, which only
  # runs while the volume is still empty.
  api-db-init:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-api-db-init
    environment:
      PGHOST: postgres
      PGUSER: ${PGUSER:-token}
      PGPASSWORD: ${PGPASSWORD:-token_local}
      PGDATABASE: ${PGDATABASE:-token_ledger_v2}
      API_PASSWORD: ${API_READONLY_PASSWORD:-api_readonly_local}
    volumes:
      - ./docker/read-only-api.sql:/read-only-api.sql:ro
    entrypoint:
      - sh
      - -c
      - >
        psql -v ON_ERROR_STOP=1
        -v api_role=api_readonly
        -v api_password="$$API_PASSWORD"
        -v db_name="$$PGDATABASE"
        -v admin_role="$$PGUSER"
        -f /read-only-api.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    logging: *logging
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: token-ledger-api:local
    container_name: token-ledger-api
    restart: unless-stopped
    environment:
      # Read-only role, not the admin one -- see docker/read-only-api.sql.
      # Muc chi tiet log. Phai khai TUONG MINH o day: compose noi suy
      # `.env` cho chinh file compose, KHONG bom bien vao container.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_LEDGER_DSN: "postgresql://api_readonly:${API_READONLY_PASSWORD:-api_readonly_local}@postgres:5432/${PGDATABASE:-token_ledger_v2}"
      # No default on purpose, but NOT `${VAR:?}`: compose interpolates the whole
      # file before filtering profiles, so `:?` would take postgres down with it
      # on a machine without .env. backend/main.py:129 refuses to start instead,
      # with a message that says what to do.
      DASHBOARD_KEY: ${DASHBOARD_KEY:-}
    ports:
      # Side door, keeps the old habit working: opening web/index.html over
      # file:// still loads. The main door is nginx on 8080.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api-db-init:
        condition: service_completed_successfully

  web:
    logging: *logging
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: token-ledger-web:local
    container_name: token-ledger-web
    restart: unless-stopped
    ports:
      # Dia chi bind doc tu bien WEB_BIND. Khong dat thi la 127.0.0.1 -- may dev
      # chi mo cho chinh no. May chu dat WEB_BIND=192.168.20.111 trong .env.
      #
      # TRUOC 13/09/2026 dia chi nay GHI CUNG, nen doi moi truong la phai sua tay
      # roi nho tra lai truoc khi push. Da quen it nhat mot lan, va chu thich in
      # hoa nhac viec do KHONG chan duoc. Bien nay bo han loai loi do: hai may
      # dung CHUNG mot file compose, khac nhau o .env -- ma .env thi khong theo
      # git. Xem openspec/changes/run-every-check-on-every-push/design.md.
      #
      # BAY VAN CON, chi doi cho: dat WEB_BIND thanh mot IP ma may KHONG CO thi
      # `web` khong bind duoc va `docker compose up` THOAT GIUA CHUNG -- keo theo
      # `gateway-lb` khong bao gio duoc dung, trong khi `docker ps` van cho thay
      # hai instance LiteLLM `healthy`. Rat de tuong la da dung xong.
      # Xem docs/archive/gateway/dua-dms-qua-gateway-31-08.md muc 4.6.
      #
      # Muon mo cho ca mang thi dat WEB_BIND=0.0.0.0 -- nhung tra loi cau nay
      # truoc: ai cham toi duoc may nay.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
      # HTTPS them 18/09/2026, song song voi HTTP o tren, khong thay the. Dung
      # CHUNG bien WEB_BIND (cung mot may, cung quy uoc loopback-truoc). Cong
      # host mac dinh 8443, KHONG phai 443 -- gateway-lb da chiem 0.0.0.0:443
      # (LLM_GATEWAY_TLS_PORT), dat WEB_TLS_PORT=443 se EADDRINUSE khi
      # WEB_BIND=0.0.0.0. Container ben trong van nghe 443 binh thuong, chi
      # cong publish ra host la khac.
      - "${WEB_BIND:-127.0.0.1}:${WEB_TLS_PORT:-8443}:443"
    volumes:
      # Chung chi TLS wildcard *.rangdong.com.vn, dung chung voi gateway-lb.
      # Xem docker/gateway/tls/README.md. File .crt/.key KHONG len git.
      - ./docker/gateway/tls:/etc/nginx/tls:ro
    depends_on:
      - api

  # Collection pipeline. Runs once and exits, not a long-lived service:
  #     docker compose run --rm tools python3 scripts/update_dashboard.py
  tools:
    logging: *logging
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: token-ledger-tools:local
    profiles: ["tools"]
    environment:
      # Admin role, unlike api: rebuild_db.py runs DROP SCHEMA.
      # Muc chi tiet log. Phai khai TUONG MINH o day: compose noi suy
      # `.env` cho chinh file compose, KHONG bom bien vao container.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_LEDGER_DSN: "postgresql://${PGUSER:-token}:${PGPASSWORD:-token_local}@postgres:5432/${PGDATABASE:-token_ledger_v2}"
      RALLI_USER: ${RALLI_USER:-}
      RALLI_PASS: ${RALLI_PASS:-}
      HD_USER: ${HD_USER:-}
      HD_PASS: ${HD_PASS:-}
    volumes:
      # data/ MUST persist: the Cloud Monitoring retention window slides fast,
      # and losing an old pull directory is permanent.
      - ${DATA_DIR:-./data}:/app/data
      - ${GCLOUD_CONFIG:-~/.config/gcloud}:/root/.config/gcloud
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # LAM MOI SO GATEWAY -- profile "refresh". Khong goi profile thi khong chay.
  #
  # VI SAO CO DICH VU NAY (do 09/09/2026)
  # So Gateway tu ghi ngay (~4 giay), nhung so dashboard chi doi khi CO NGUOI
  # chay `scripts/refresh_gateway.py`. Do duoc truoc khi them dich vu nay:
  #
  #     LiteLLM_SpendLogs                 444 dong, moi nhat 08/09 23:55
  #     fact_call WHERE source='gateway'   41 dong, moi nhat 31/08 10:17
  #     -> tre 8 ngay 13 gio 38 phut, va KHONG co dau hieu nao bao la dang tre
  #
  # Script da co san che do `--every`; cai thieu la khong ai chay no.
  # ==========================================================================
  ledger-refresh:
    logging: *logging
    # Dung lai HET image cua `tools`, khong them Dockerfile moi. `tools` la image
    # CO QUYEN GHI (vai admin), dung vai cua no la dung phan cong da co: `api`
    # chi-doc, `tools` ghi duoc. Xem chu thich o docker/tools.Dockerfile.
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: token-ledger-tools:local
    container_name: token-ledger-refresh
    profiles: ["refresh"]
    restart: unless-stopped
    # `sys.executable` duoc dung ben trong script de goi bon buoc, nen chi can
    # dung trinh thong dich cua image -- khong phu thuoc `python` co ton tai.
    command: ["python3", "scripts/refresh_gateway.py", "--every", "${REFRESH_EVERY_SECONDS:-300}"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # PHAI khai CA HAI chuoi ket noi TUONG MINH. db/connect.py dung `PG_HOST`
      # mac dinh `localhost`; trong container thi `localhost` la CHINH container
      # nay, khong phai may postgres. Trieu chung se la "khong ket noi duoc" --
      # keu ngay, nhung khong duoc trong vao mac dinh.
      TOKEN_LEDGER_DSN: "postgresql://${PGUSER:-token}:${PGPASSWORD:-token_local}@postgres:5432/${PGDATABASE:-token_ledger_v2}"
      # Vai CHI-DOC cho so Gateway. KHONG dung `llmproxy` (chu so huu, ghi duoc):
      # so goc la bang chung. Vai nay do `gateway-readonly-init` tao ra o profile
      # "gateway"; no ton tai san trong volume pgdata nen khong khai depends_on
      # sang profile khac -- lam vay se keo ca profile "gateway" theo.
      GATEWAY_DSN: "postgresql://${GATEWAY_READONLY_USER:-gateway_readonly}:${GATEWAY_READONLY_PASSWORD:-gateway_readonly_local}@postgres:5432/${GATEWAY_PGDATABASE:-litellm}"
    # CO Y KHONG DAT healthcheck. Healthcheck kieu "tien trinh con song" chinh la
    # phep do sai ma change nay di sua: mot vong lap con chay ma khong lam moi
    # duoc lan nao van qua duoc phep do do -- dung lop "song ma hong" da gap o
    # /health/liveliness cua Gateway. Phep do dung la DO KET QUA: so co tuoi
    # khong, va no nam o phep kiem do tre trong scripts/audit_db.py.
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # API GATEWAY -- profile "gateway". Khong goi profile thi khong khoi dong.
  # Ke hoach: planning/Master Plan API Gateway.xlsx, GD2 dong 7-8 va GD5 dong 13-15.
  # ==========================================================================

  # Tao role + database `litellm` tren chinh may postgres o tren, roi DO lai xem
  # role do co doc duoc token_ledger khong. Chay xong la thoat; cac dich vu duoi
  # doi no thoat voi ma 0.
  gateway-db-init:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-gateway-db-init
    profiles: ["gateway"]
    environment:
      PGHOST: postgres
      # `postgres` la database quan tri, LUON ton tai. KHONG dung ${PGDATABASE}
      # o day: docker-compose va db/connect.py deu mac dinh `token_ledger_v2`.
      # `token_ledger` legacy da bi XOA ngay 14/09/2026. Script van tu di tim MOI
      # database khop '^token_ledger' de do ranh gioi, nen them database so moi thi
      # khong phai sua o day.
      ADMIN_DB: postgres
      ADMIN_USER: ${PGUSER:-token}
      ADMIN_PASSWORD: ${PGPASSWORD:-token_local}
      GW_DB: ${GATEWAY_PGDATABASE:-litellm}
      GW_USER: ${GATEWAY_PGUSER:-llmproxy}
      GW_PASSWORD: ${GATEWAY_PGPASSWORD:-llmproxy_local}
    volumes:
      - ./docker/gateway/init-db.sh:/init-db.sh:ro
    entrypoint: ["sh", "/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Vai CHI-DOC cho db/load_gateway.py. Tach khoi gateway-db-init o tren vi hai
  # viec khac han: cai kia tao database va vai CHU SO HUU cho LiteLLM ghi vao,
  # cai nay chi cap quyen DOC dung mot bang cho phia dashboard.
  #
  # KHONG dung lai docker/read-only-api.sql: script do REVOKE tren ca schema va
  # moi bang. Chay len database ma LiteLLM dang migrate bang Prisma la rui ro
  # thua. File duoi day chi GRANT, khong REVOKE gi.
  gateway-readonly-init:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-gateway-readonly-init
    profiles: ["gateway"]
    environment:
      PGHOST: postgres
      PGUSER: ${PGUSER:-token}
      PGPASSWORD: ${PGPASSWORD:-token_local}
      GW_DB: ${GATEWAY_PGDATABASE:-litellm}
      GW_RO_USER: ${GATEWAY_READONLY_USER:-gateway_readonly}
      GW_RO_PASSWORD: ${GATEWAY_READONLY_PASSWORD:-gateway_readonly_local}
    volumes:
      - ./docker/read-only-gateway.sql:/read-only-gateway.sql:ro
    entrypoint:
      - sh
      - -c
      - >
        psql -d "$$GW_DB" -v ON_ERROR_STOP=1
        -v gw_role="$$GW_RO_USER"
        -v gw_password="$$GW_RO_PASSWORD"
        -v gw_db="$$GW_DB"
        -f /read-only-gateway.sql
    depends_on:
      gateway-db-init:
        condition: service_completed_successfully
    restart: "no"

  # Trang thai dung chung cua CA HAI instance LiteLLM: bo dem rpm/tpm, danh sach
  # tuyen dang bi phat nguoi. Chinh no lam LiteLLM chay stateless duoc.
  redis:
    logging: *logging
    image: redis:7-alpine
    container_name: token-ledger-redis
    profiles: ["gateway"]
    restart: unless-stopped
    # Cau hinh chuyen tu CO DONG LENH sang FILE ngay 07/09/2026. Cac tuy chon cu
    # (requirepass, appendonly, maxmemory, maxmemory-policy) nay nam trong
    # docker/gateway/redis/redis.conf.template, kem ly do.
    #
    # Tom tat ly do: Sentinel doi vai bang cach bao Redis ghi lai file cau hinh
    # cua chinh no. Khong co file thi ket qua thang cap chi nam trong bo nho va
    # bi xoa o lan restart ke tiep -- da do 07/09, xem template.
    entrypoint: ["sh", "/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
      REDIS_CONF_TEMPLATE: /redis.conf.template
      # File that nam tren volume `redisdata` -> ghi duoc va ben qua restart.
      REDIS_CONF_PATH: /data/redis.conf
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # IP TINH: Sentinel giam sat bang dia chi nay. Dung ten service thi luc
    # container chet, DNS Docker mat ten do va sentinel roi vao +tilt thay vi
    # chuyen vai. Xem khoi `networks:` cuoi file.
    networks:
      default:
        ipv4_address: 172.20.250.10
    volumes:
      - redisdata:/data
      # Ban mau va entrypoint gan `:ro` duoc: chung KHONG phai thu Sentinel ghi
      # lai. Thu do la /data/redis.conf, nam tren volume o dong tren.
      - ./docker/gateway/redis/redis.conf.template:/redis.conf.template:ro
      - ./docker/gateway/redis/entrypoint.sh:/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Ban sao. Ke hoach GD5 dong 13: "Redis 1 primary + 1 replica".
  #
  # TU 07/09/2026 DA CO SENTINEL: primary chet thi ban sao TU len thay, khong
  # can nguoi. Do duoc ca hai chieu: 6 giay va 7 giay tu luc `docker kill` toi
  # luc sentinel tra ve dia chi master moi, va LiteLLM tu di theo (10/10 luot
  # 200 ngay sau do, khong khoi dong lai instance nao).
  #
  # NOI RO DIEU NAY KHONG BAO VE: ca ba sentinel chay tren CUNG MOT MAY voi ca
  # hai Redis. May chet la chet het. Thu duy nhat duoc bao ve la kich ban "tien
  # trinh Redis hong vinh vien trong khi may chu con song".
  #
  # Va noi ro muc nghiem trong cua van de goc la THAP: do 07/09, tat han Redis
  # thi Gateway VAN phuc vu (9/10 luot 200, p50 0,87s), vi moi thu Redis giu deu
  # co TTL <= 60 giay va tu dung lai tu luu luong binh thuong. Sentinel dung o
  # day de dong mot muc GD5 con no, khong phai de va mot lo hong nguy hiem.
  redis-replica:
    logging: *logging
    image: redis:7-alpine
    container_name: token-ledger-redis-replica
    profiles: ["gateway"]
    restart: unless-stopped
    # Cung ly do voi `redis` o tren: chuyen sang file cau hinh 07/09/2026.
    #
    # RIENG BAN SAO thi day KHONG chi la chuyen gon gang ma la DIEU KIEN de
    # Sentinel co nghia. Truoc do co `--replicaof redis 6379` ghi cung o day, va
    # da do duoc: thang no len master roi restart container thi no TUT VE LAM
    # BAN SAO cua master cu. Moi lan failover deu bi xoa nhu vay.
    entrypoint: ["sh", "/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
      REDIS_CONF_TEMPLATE: /redis.conf.template
      REDIS_CONF_PATH: /data/redis.conf
    networks:
      default:
        ipv4_address: 172.20.250.11
    volumes:
      - redisreplicadata:/data
      - ./docker/gateway/redis/redis-replica.conf.template:/redis.conf.template:ro
      - ./docker/gateway/redis/entrypoint.sh:/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  # --- Sentinel: ba tien trinh, quorum 2 --------------------------------------
  #
  # BA chu khong phai MOT. Sentinel quyet dinh thang cap bang quorum; mot sentinel
  # thi khong co quorum, no chi la mot diem chet moi. Ba la so le nho nhat cho
  # phep mat mot ma van quyet duoc. Chi tiet o config sentinel.conf.template.
  #
  # NOI RO DIEU NAY KHONG BAO VE: ca ba chay tren CUNG MOT MAY voi ca hai Redis.
  # May chet la chet het. Cai duoc bao ve la kich ban "tien trinh Redis hong vinh
  # vien trong khi may chu con song" -- va CHI kich ban do.
  sentinel-1:
    logging: *logging
    <<: *sentinel
    container_name: token-ledger-sentinel-1
    volumes:
      - sentinel1data:/data
      - ./docker/gateway/redis/sentinel.conf.template:/sentinel.conf.template:ro
      - ./docker/gateway/redis/entrypoint-sentinel.sh:/sentinel-entrypoint.sh:ro

  sentinel-2:
    logging: *logging
    <<: *sentinel
    container_name: token-ledger-sentinel-2
    volumes:
      - sentinel2data:/data
      - ./docker/gateway/redis/sentinel.conf.template:/sentinel.conf.template:ro
      - ./docker/gateway/redis/entrypoint-sentinel.sh:/sentinel-entrypoint.sh:ro

  sentinel-3:
    logging: *logging
    <<: *sentinel
    container_name: token-ledger-sentinel-3
    volumes:
      - sentinel3data:/data
      - ./docker/gateway/redis/sentinel.conf.template:/sentinel.conf.template:ro
      - ./docker/gateway/redis/entrypoint-sentinel.sh:/sentinel-entrypoint.sh:ro

  litellm-1:
    logging: *logging
    <<: *litellm
    container_name: token-ledger-litellm-1
    expose:
      - "4000"

  litellm-2:
    logging: *logging
    <<: *litellm
    container_name: token-ledger-litellm-2
    expose:
      - "4000"

  # Cua vao duy nhat cua Gateway. Chia luot round-robin; loai instance hong khoi
  # vong bang cach dem loi that - nginx ban mo nguon khong co health check chu
  # dong (xem chu thich trong docker/gateway/nginx.conf).
  gateway-lb:
    logging: *logging
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: token-ledger-gateway-lb
    profiles: ["gateway"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      STATUS_BIND: "127.0.0.1"
      STATUS_PORT: "8089"
      LLM_GATEWAY_DOMAIN: ${LLM_GATEWAY_DOMAIN:-apigateway.rangdong.com.vn}
      LLM_GATEWAY_ADMIN_CIDR: ${LLM_GATEWAY_ADMIN_CIDR:-127.0.0.1/32}
      # Dai LAN duoc phep xem web/status. Mac dinh loopback (vo hai, trung voi
      # allow 127.0.0.1 co san) -- phai dat ro trong .env moi thuc su mo cho LAN.
      LLM_GATEWAY_LAN_CIDR: ${LLM_GATEWAY_LAN_CIDR:-127.0.0.1/32}
      NGINX_ENVSUBST_FILTER: ^LLM_GATEWAY_(DOMAIN|ADMIN_CIDR|LAN_CIDR)$
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # Chung chi TLS wildcard *.rangdong.com.vn that (Sectigo), xem
      # docker/gateway/tls/README.md. File .crt/.key KHONG len git.
      - ./docker/gateway/tls:/etc/nginx/tls:ro
    ports:
      - "${LLM_GATEWAY_EDGE_BIND:-127.0.0.1}:${LLM_GATEWAY_EDGE_PORT:-8088}:4000"
      # HTTPS them 18/09/2026, song song voi HTTP o tren, khong thay the. Mac
      # dinh CO Y giu loopback (an toan-truoc) -- phai tu dat
      # LLM_GATEWAY_TLS_BIND trong .env moi thuc su mo ra ngoai (giong quy uoc
      # cua LLM_GATEWAY_EDGE_BIND).
      - "${LLM_GATEWAY_TLS_BIND:-127.0.0.1}:${LLM_GATEWAY_TLS_PORT:-443}:4443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4000/lb-health | grep -q lb-ok && wget -q -O /dev/null http://127.0.0.1:8089/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Canh Gateway theo nhip roi GUI THU khi trang thai doi.
  #
  # `gateway-status` o tren DO nhung khong bao: no la mot trang web, phai co nguoi
  # mo ra xem. Khong ai mo luc 2 gio sang. Dich vu nay bien trang do thanh thu.
  #
  # KHONG CO `ports`, KHONG CO CA `expose` -- va do la dong quan trong nhat o day.
  # Moi dich vu khac trong file nay deu MO CUA: web 8080, gateway-lb 8088,
  # gateway-status 8089, api 8000, postgres 5432. Cai nay chi GO CUA nguoi khac,
  # khong ai goi vao no. Be mat tan cong no them vao: khong co.
  #
  # Vi no nam TRONG mang, no goi thang `gateway-status:8089` va `gateway-lb:4000`
  # bang ten, KHONG qua nginx -- nen khong phai noi `LLM_GATEWAY_ADMIN_CIDR`, khong
  # phai doi bind cua dich vu nao. Do 17/09: chi can dat `Host: localhost`, thieu
  # header do thi server.js tra 403.
  #
  # CO Y KHONG DAT `healthcheck`, cung ly do `ledger-refresh` khong dat: "tien trinh
  # con song" la phep do sai. Phep do dung la THU NHIP TIM moi ngay -- vang thu do
  # la tin hieu cho canh da chet.
  gateway-watch:
    logging: *logging
    # Dung lai HET image cua `tools`. Khong Dockerfile moi, khong goi phu thuoc moi:
    # script chi dung `urllib` va `smtplib` cua thu vien chuan.
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: token-ledger-tools:local
    container_name: token-ledger-gateway-watch
    profiles: ["gateway"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["python3", "scripts/watch_gateway.py",
              "--every", "${WATCH_EVERY_SECONDS:-60}"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # BAT BUOC. Thieu no thi mot dong log tieng Viet lam script chet giua chung.
      PYTHONIOENCODING: utf-8
      WATCH_NAME: ${WATCH_NAME:-trong}
      # MOI DICH DOC TU BIEN, khong ghim trong ma -- xem design.md D11. Cung mot tep
      # `.py` chay duoc ca o day lan tren mot may khac; hai noi khac nhau o TAP DICH,
      # khong khac o hanh vi.
      #
      # Mac dinh CO Y khong chua dich qua ten mien public. Do 17/09:
      # `apigateway.rangdong.com.vn` tra `Non-existent domain`, nen bat no len o day
      # la tu tao mot dich DO MOI PHUT trong khi he thong hoan toan khoe.
      WATCH_HTTP: ${WATCH_HTTP:-lb=http://gateway-lb:4000/health/readiness}
      # 200 chua chac la dung: `/health/readiness` co the tra 200 ma `db` khong noi
      # duoc. Chuoi nay bat buoc than tra loi phai co `connected`.
      WATCH_EXPECT: ${WATCH_EXPECT:-lb=connected}
      WATCH_STATUS_URL: ${WATCH_STATUS_URL:-http://gateway-status:8089/api/status}
      WATCH_STATE_FILE: /var/watch/state.json
      WATCH_TIMEOUT_SECONDS: ${WATCH_TIMEOUT_SECONDS:-25}
      WATCH_FAILS_BEFORE: ${WATCH_FAILS_BEFORE:-2}
      WATCH_HEARTBEAT_HOUR: ${WATCH_HEARTBEAT_HOUR:-8}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      # DUY NHAT mot cho ghi duoc. `read_only: true` khoa phan con lai cua he thong
      # tep. Trang thai PHAI song sot qua mot lan dung lai container: giu trong bo
      # nho thi moi lan `restart` la them mot thu cho cung mot su co.
      - watchstate:/var/watch
    # Image `tools` chay bang root theo thiet ke cua no (xem docker/tools.Dockerfile).
    # ponytail: giu root, vi doi UID thi volume `watchstate` do root tao ra se khong
    # ghi duoc. Da bu bang read_only + cap_drop ALL + no-new-privileges + khong cong
    # nao. Muon chat hon thi phai `chown` volume luc khoi tao -- lam khi co yeu cau that.
    tmpfs:
      - /tmp

# Khai ro dai mang de gan duoc IP TINH cho hai Redis.
#
# VI SAO CAN: Sentinel giam sat master bang dia chi. Neu dia chi la TEN service,
# thi luc container do chet, DNS cua Docker khong con phan giai duoc ten nua ->
# sentinel bao "Failed to resolve hostname 'redis'" lien tuc roi vao +tilt (che
# do tu khoa khi nghi ngo bat thuong), va o tilt thi no KHONG chuyen vai.
# Do duoc 07/09/2026: giet redis xong, sentinel thay s_down nhung dung im.
#
# Dai giu NGUYEN 172.20.0.0/16 nhu Docker da tu cap, va TEN mang khong doi
# (token-ledger-dashboard_default) -- rang buoc `external` trong compose cua DMS
# van tro dung.
#
# Hai IP dat o .250.x, xa vung Docker tu cap (bat dau tu .0.2), de khong dung do.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pgdata:
  pgadmin:
  redisdata:
  redisreplicadata:
  # Moi sentinel mot volume rieng: no tu viet lai file cau hinh cua chinh no,
  # dung chung la ba tien trinh giam len nhau.
  sentinel1data:
  sentinel2data:
  sentinel3data:
  # Chi giu mot tep JSON nho: trang thai hien tai, moc bat dau su co, ngay da gui
  # nhip tim. No ton tai de mot lan `restart` khong sinh them thu cho su co dang chay.
  watchstate:
