# HAI TANG trong mot file, tach nhau bang `profiles`.
#
# Tang 1 - DASHBOARD (mac dinh): PostgreSQL + pgAdmin. Khong doi gi so voi truoc.
#
#     docker compose up -d
#     docker compose logs -f postgres     # xem log
#     docker compose down                 # dung, GIU du lieu
#     docker compose down -v              # dung va XOA sach du lieu
#
#     Postgres   localhost:5432
#     pgAdmin    http://localhost:5050
#
# Tang 2 - API GATEWAY (chi len khi goi ten profile): redis primary + replica,
# 2 instance LiteLLM chay stateless, nginx lam load balancer.
#
#     docker compose --profile gateway up -d
#     docker compose --profile gateway logs -f litellm-1
#     docker compose --profile gateway down       # chi ha Gateway
#
#     Gateway (qua LB)  http://127.0.0.1:4000
#     Redis             127.0.0.1:6379
#
# `docker compose up -d` KHONG keo Gateway len: dich vu co profile chi chay khi
# goi dung ten profile, hoac goi dich danh ten dich vu.
#
# Vi sao la profile chu khong phai mot file compose thu hai: Gateway ghi so vao
# CHINH may PostgreSQL nay (database rieng ten `litellm`), nen no phai doi
# postgres khoe roi moi len. Hai file compose roi thi khong khai duoc rang buoc do.
#
# Doi cong / mat khau thi dat bien trong file .env (da nam trong .gitignore).
# Khong dat thi dung gia tri mac dinh duoi day - chap nhan duoc vi CHI mo tren
# 127.0.0.1, khong ra mang.

# Xoay vong log. KHONG dat thi Docker dung json-file KHONG GIOI HAN kich thuoc:
# file log lon dan mai cho toi luc day o - ma o do cung dang chua volume pgdata,
# tuc ca token_ledger_v2 lan so Gateway.
#
# 10m x 3 = 30 MB moi container. Dat o khoi dung chung chu khong chep vao tung
# dich vu: 13 dich vu ma chep 13 lan thi lan sau doi se sot. Cung co che neo YAML
# ma `x-litellm` ngay duoi dang dung.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hai instance LiteLLM giong het nhau, tru ten container va cong mo ra ngoai.
# Giong het la CO Y: "stateless" nghia la roi vao may nao cung ra cung ket qua.
# Ba sentinel giong het nhau tru ten container va volume giu cau hinh rieng cua
# tung cai. Moi cai PHAI co volume rieng: Sentinel tu viet lai file cau hinh cua
# no, dung chung mot volume la ba tien trinh giam len nhau.
x-sentinel: &sentinel
  image: redis:7-alpine
  profiles: ["gateway"]
  restart: unless-stopped
  entrypoint: ["sh", "/sentinel-entrypoint.sh"]
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
    SENTINEL_CONF_TEMPLATE: /sentinel.conf.template
    SENTINEL_CONF_PATH: /data/sentinel.conf
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s
  depends_on:
    redis:
      condition: service_healthy
    redis-replica:
      condition: service_healthy

x-litellm: &litellm
  build:
    # Fork nam NGANG HANG du an, khong long ben trong (repo long repo thi
    # `git clean -xfd` xoa ca fork). Doi cho fork di la compose bao loi ngay.
    # Ban da do: commit f005afa146, litellm 1.99.0.
    context: ../litellm_tuan_test
  image: litellm_tuan_test:gateway
  profiles: ["gateway"]
  restart: unless-stopped
  # entrypoint rieng: chan khoi dong khi thieu khoa, roi moi giao lai cho
  # entrypoint that cua image. Xem docker/gateway/entrypoint.sh.
  entrypoint: ["sh", "/gateway-entrypoint.sh"]
  command: ["--config=/app/config.yaml", "--port", "4000"]
  volumes:
    - ./docker/gateway/config.gateway.yaml:/app/config.yaml:ro
    - ./docker/gateway/entrypoint.sh:/gateway-entrypoint.sh:ro
  environment:
    # Database RIENG tren chinh may postgres o duoi. token_ledger phai co DUNG 0
    # bang LiteLLM_* - do la mot phep kiem nghiem thu, khong phai so thich.
    DATABASE_URL: "postgresql://${GATEWAY_PGUSER:-llmproxy}:${GATEWAY_PGPASSWORD:-llmproxy_local}@postgres:5432/${GATEWAY_PGDATABASE:-litellm}"
    STORE_MODEL_IN_DB: "False"
    # Ba bien duoi day KHONG co gia tri mac dinh. Thieu thi entrypoint dung han.
    # Khong dung `${VAR:?}` duoc: compose noi bien cho CA file truoc khi loc
    # profile, nen `:?` se lam `docker compose up -d` cua dashboard gay theo.
    LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
    KEY_GOOGLE_AI_STU: ${KEY_GOOGLE_AI_STU:-}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
    # Dia chi master hoi Sentinel, khong ghim. REDIS_HOST o tren van phai giu:
    # Router chi dung Redis khi co redis_host+redis_port (router.py:565), va
    # ban va trong fork loai `host`/`port` ra khoi sentinel_kwargs nen no khong
    # con gay "multiple values for argument 'host'" nua.
    # Xem litellm/_redis.py: _SENTINEL_IGNORED_CONNECTION_ARGS.
    REDIS_SENTINEL_NODES: '[["sentinel-1", 26379], ["sentinel-2", 26379], ["sentinel-3", 26379]]'
    REDIS_SERVICE_NAME: gateway-redis
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\", timeout=3).status == 200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 18
    # Lan dau phai chay `prisma migrate deploy` dung 75 bang -> lau hon han.
    start_period: 90s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    gateway-db-init:
      condition: service_completed_successfully
    # Tu 07/09/2026 LiteLLM hoi Sentinel xem master hien la ai, thay vi tro thang
    # vao `redis`. Nen phai doi sentinel khoe da, khong thi lan khoi dong dau no
    # khong tra ra duoc dia chi master nao.
    sentinel-1:
      condition: service_healthy
    sentinel-2:
      condition: service_healthy
    sentinel-3:
      condition: service_healthy

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-postgres
    restart: unless-stopped
    environment:
      # Must match db/connect.py:75. Before 29/08 this defaulted to
      # `token_ledger` while the code read `token_ledger_v2` -- harmless here
      # since both exist, fatal on a fresh server. Set PGDATABASE in .env.
      POSTGRES_DB: ${PGDATABASE:-token_ledger_v2}
      POSTGRES_USER: ${PGUSER:-token}
      POSTGRES_PASSWORD: ${PGPASSWORD:-token_local}
      # Sap xep theo C cho ket qua ORDER BY on dinh, khong phu thuoc locale may.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Gan vao 127.0.0.1, KHONG phai 0.0.0.0: database nay khong duoc ra mang.
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pgAdmin cho khoe roi moi len, va script chuyen du lieu cung doi cai nay.
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-token} -d ${PGDATABASE:-token_ledger_v2}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pgadmin:
    logging: *logging
    image: dpage/pgadmin4:8
    container_name: token-ledger-pgadmin
    restart: unless-stopped
    environment:
      # PHAI la email dung dinh dang co phan duoi mien. pgAdmin tu chuc nang
      # kiem dinh dang va THOAT neu sai - 'admin@local' bi tu choi, container
      # restart-loop mai ma khong bao gi ra ngoai ngoai log.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_local}
      # Bo man hinh dang nhap master password - day la may cuc bo, khong dang.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      # Khai bao san may chu, khoi phai go tay thong tin ket noi moi lan.
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # DASHBOARD -- no profile, `docker compose up -d` starts it.
  # http://127.0.0.1:8080
  # ==========================================================================

  # Creates the read-only role. Not /docker-entrypoint-initdb.d, which only
  # runs while the volume is still empty.
  api-db-init:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-api-db-init
    environment:
      PGHOST: postgres
      PGUSER: ${PGUSER:-token}
      PGPASSWORD: ${PGPASSWORD:-token_local}
      PGDATABASE: ${PGDATABASE:-token_ledger_v2}
      API_PASSWORD: ${API_READONLY_PASSWORD:-api_readonly_local}
    volumes:
      - ./docker/read-only-api.sql:/read-only-api.sql:ro
    entrypoint:
      - sh
      - -c
      - >
        psql -v ON_ERROR_STOP=1
        -v api_role=api_readonly
        -v api_password="$$API_PASSWORD"
        -v db_name="$$PGDATABASE"
        -v admin_role="$$PGUSER"
        -f /read-only-api.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    logging: *logging
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: token-ledger-api:local
    container_name: token-ledger-api
    restart: unless-stopped
    environment:
      # Read-only role, not the admin one -- see docker/read-only-api.sql.
      # Muc chi tiet log. Phai khai TUONG MINH o day: compose noi suy
      # `.env` cho chinh file compose, KHONG bom bien vao container.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_LEDGER_DSN: "postgresql://api_readonly:${API_READONLY_PASSWORD:-api_readonly_local}@postgres:5432/${PGDATABASE:-token_ledger_v2}"
      # No default on purpose, but NOT `${VAR:?}`: compose interpolates the whole
      # file before filtering profiles, so `:?` would take postgres down with it
      # on a machine without .env. backend/main.py:129 refuses to start instead,
      # with a message that says what to do.
      DASHBOARD_KEY: ${DASHBOARD_KEY:-}
    ports:
      # Side door, keeps the old habit working: opening web/index.html over
      # file:// still loads. The main door is nginx on 8080.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api-db-init:
        condition: service_completed_successfully

  web:
    logging: *logging
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: token-ledger-web:local
    container_name: token-ledger-web
    restart: unless-stopped
    ports:
      # Switch to 0.0.0.0 for a real deployment -- but answer this first:
      # who can reach this machine.
      #
      # BAY khi chay tren may KHONG PHAI server: may do khong co IP nay nen `web`
      # khong bind duoc, va `docker compose up` THOAT GIUA CHUNG -- keo theo
      # `gateway-lb` khong bao gio duoc dung, trong khi `docker ps` van cho thay
      # hai instance LiteLLM `healthy`. Rat de tuong la da dung xong.
      # Xem docs/reference/dua-dms-qua-gateway-31-08.md muc 4.6.
      #
      # Chay tren may dev thi doi tam sang dong duoi, va TRA LAI TRUOC KHI PUSH:
      #     - "127.0.0.1:${WEB_PORT:-8080}:80"
      - "192.168.20.111:${WEB_PORT:-8080}:80"
    depends_on:
      - api

  # Collection pipeline. Runs once and exits, not a long-lived service:
  #     docker compose run --rm tools python3 scripts/update_dashboard.py
  tools:
    logging: *logging
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    image: token-ledger-tools:local
    profiles: ["tools"]
    environment:
      # Admin role, unlike api: rebuild_db.py runs DROP SCHEMA.
      # Muc chi tiet log. Phai khai TUONG MINH o day: compose noi suy
      # `.env` cho chinh file compose, KHONG bom bien vao container.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_LEDGER_DSN: "postgresql://${PGUSER:-token}:${PGPASSWORD:-token_local}@postgres:5432/${PGDATABASE:-token_ledger_v2}"
      RALLI_USER: ${RALLI_USER:-}
      RALLI_PASS: ${RALLI_PASS:-}
      HD_USER: ${HD_USER:-}
      HD_PASS: ${HD_PASS:-}
    volumes:
      # data/ MUST persist: the Cloud Monitoring retention window slides fast,
      # and losing an old pull directory is permanent.
      - ${DATA_DIR:-./data}:/app/data
      - ${GCLOUD_CONFIG:-~/.config/gcloud}:/root/.config/gcloud
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # API GATEWAY -- profile "gateway". Khong goi profile thi khong khoi dong.
  # Ke hoach: Master Plan API Gateway.xlsx, GD2 dong 7-8 va GD5 dong 13-15.
  # ==========================================================================

  # Tao role + database `litellm` tren chinh may postgres o tren, roi DO lai xem
  # role do co doc duoc token_ledger khong. Chay xong la thoat; cac dich vu duoi
  # doi no thoat voi ma 0.
  gateway-db-init:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-gateway-db-init
    profiles: ["gateway"]
    environment:
      PGHOST: postgres
      # `postgres` la database quan tri, LUON ton tai. KHONG dung ${PGDATABASE}
      # o day: docker-compose va db/connect.py deu mac dinh `token_ledger_v2`.
      # `token_ledger` legacy van nam ben canh tren volume da migrate; quyet dinh
      # 27/08 khong DROP/rename no. Script tu di tim moi database khop
      # '^token_ledger' de do ranh gioi tren ca legacy lan runtime ledger.
      ADMIN_DB: postgres
      ADMIN_USER: ${PGUSER:-token}
      ADMIN_PASSWORD: ${PGPASSWORD:-token_local}
      GW_DB: ${GATEWAY_PGDATABASE:-litellm}
      GW_USER: ${GATEWAY_PGUSER:-llmproxy}
      GW_PASSWORD: ${GATEWAY_PGPASSWORD:-llmproxy_local}
    volumes:
      - ./docker/gateway/init-db.sh:/init-db.sh:ro
    entrypoint: ["sh", "/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Vai CHI-DOC cho db/load_gateway.py. Tach khoi gateway-db-init o tren vi hai
  # viec khac han: cai kia tao database va vai CHU SO HUU cho LiteLLM ghi vao,
  # cai nay chi cap quyen DOC dung mot bang cho phia dashboard.
  #
  # KHONG dung lai docker/read-only-api.sql: script do REVOKE tren ca schema va
  # moi bang. Chay len database ma LiteLLM dang migrate bang Prisma la rui ro
  # thua. File duoi day chi GRANT, khong REVOKE gi.
  gateway-readonly-init:
    logging: *logging
    image: postgres:17-alpine
    container_name: token-ledger-gateway-readonly-init
    profiles: ["gateway"]
    environment:
      PGHOST: postgres
      PGUSER: ${PGUSER:-token}
      PGPASSWORD: ${PGPASSWORD:-token_local}
      GW_DB: ${GATEWAY_PGDATABASE:-litellm}
      GW_RO_USER: ${GATEWAY_READONLY_USER:-gateway_readonly}
      GW_RO_PASSWORD: ${GATEWAY_READONLY_PASSWORD:-gateway_readonly_local}
    volumes:
      - ./docker/read-only-gateway.sql:/read-only-gateway.sql:ro
    entrypoint:
      - sh
      - -c
      - >
        psql -d "$$GW_DB" -v ON_ERROR_STOP=1
        -v gw_role="$$GW_RO_USER"
        -v gw_password="$$GW_RO_PASSWORD"
        -v gw_db="$$GW_DB"
        -f /read-only-gateway.sql
    depends_on:
      gateway-db-init:
        condition: service_completed_successfully
    restart: "no"

  # Trang thai dung chung cua CA HAI instance LiteLLM: bo dem rpm/tpm, danh sach
  # tuyen dang bi phat nguoi. Chinh no lam LiteLLM chay stateless duoc.
  redis:
    logging: *logging
    image: redis:7-alpine
    container_name: token-ledger-redis
    profiles: ["gateway"]
    restart: unless-stopped
    # Cau hinh chuyen tu CO DONG LENH sang FILE ngay 07/09/2026. Cac tuy chon cu
    # (requirepass, appendonly, maxmemory, maxmemory-policy) nay nam trong
    # docker/gateway/redis/redis.conf.template, kem ly do.
    #
    # Tom tat ly do: Sentinel doi vai bang cach bao Redis ghi lai file cau hinh
    # cua chinh no. Khong co file thi ket qua thang cap chi nam trong bo nho va
    # bi xoa o lan restart ke tiep -- da do 07/09, xem template.
    entrypoint: ["sh", "/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
      REDIS_CONF_TEMPLATE: /redis.conf.template
      # File that nam tren volume `redisdata` -> ghi duoc va ben qua restart.
      REDIS_CONF_PATH: /data/redis.conf
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # IP TINH: Sentinel giam sat bang dia chi nay. Dung ten service thi luc
    # container chet, DNS Docker mat ten do va sentinel roi vao +tilt thay vi
    # chuyen vai. Xem khoi `networks:` cuoi file.
    networks:
      default:
        ipv4_address: 172.20.250.10
    volumes:
      - redisdata:/data
      # Ban mau va entrypoint gan `:ro` duoc: chung KHONG phai thu Sentinel ghi
      # lai. Thu do la /data/redis.conf, nam tren volume o dong tren.
      - ./docker/gateway/redis/redis.conf.template:/redis.conf.template:ro
      - ./docker/gateway/redis/entrypoint.sh:/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Ban sao. Ke hoach GD5 dong 13: "Redis 1 primary + 1 replica".
  #
  # TU 07/09/2026 DA CO SENTINEL: primary chet thi ban sao TU len thay, khong
  # can nguoi. Do duoc ca hai chieu: 6 giay va 7 giay tu luc `docker kill` toi
  # luc sentinel tra ve dia chi master moi, va LiteLLM tu di theo (10/10 luot
  # 200 ngay sau do, khong khoi dong lai instance nao).
  #
  # NOI RO DIEU NAY KHONG BAO VE: ca ba sentinel chay tren CUNG MOT MAY voi ca
  # hai Redis. May chet la chet het. Thu duy nhat duoc bao ve la kich ban "tien
  # trinh Redis hong vinh vien trong khi may chu con song".
  #
  # Va noi ro muc nghiem trong cua van de goc la THAP: do 07/09, tat han Redis
  # thi Gateway VAN phuc vu (9/10 luot 200, p50 0,87s), vi moi thu Redis giu deu
  # co TTL <= 60 giay va tu dung lai tu luu luong binh thuong. Sentinel dung o
  # day de dong mot muc GD5 con no, khong phai de va mot lo hong nguy hiem.
  redis-replica:
    logging: *logging
    image: redis:7-alpine
    container_name: token-ledger-redis-replica
    profiles: ["gateway"]
    restart: unless-stopped
    # Cung ly do voi `redis` o tren: chuyen sang file cau hinh 07/09/2026.
    #
    # RIENG BAN SAO thi day KHONG chi la chuyen gon gang ma la DIEU KIEN de
    # Sentinel co nghia. Truoc do co `--replicaof redis 6379` ghi cung o day, va
    # da do duoc: thang no len master roi restart container thi no TUT VE LAM
    # BAN SAO cua master cu. Moi lan failover deu bi xoa nhu vay.
    entrypoint: ["sh", "/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
      REDIS_CONF_TEMPLATE: /redis.conf.template
      REDIS_CONF_PATH: /data/redis.conf
    networks:
      default:
        ipv4_address: 172.20.250.11
    volumes:
      - redisreplicadata:/data
      - ./docker/gateway/redis/redis-replica.conf.template:/redis.conf.template:ro
      - ./docker/gateway/redis/entrypoint.sh:/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  # --- Sentinel: ba tien trinh, quorum 2 --------------------------------------
  #
  # BA chu khong phai MOT. Sentinel quyet dinh thang cap bang quorum; mot sentinel
  # thi khong co quorum, no chi la mot diem chet moi. Ba la so le nho nhat cho
  # phep mat mot ma van quyet duoc. Chi tiet o config sentinel.conf.template.
  #
  # NOI RO DIEU NAY KHONG BAO VE: ca ba chay tren CUNG MOT MAY voi ca hai Redis.
  # May chet la chet het. Cai duoc bao ve la kich ban "tien trinh Redis hong vinh
  # vien trong khi may chu con song" -- va CHI kich ban do.
  sentinel-1:
    logging: *logging
    <<: *sentinel
    container_name: token-ledger-sentinel-1
    volumes:
      - sentinel1data:/data
      - ./docker/gateway/redis/sentinel.conf.template:/sentinel.conf.template:ro
      - ./docker/gateway/redis/entrypoint-sentinel.sh:/sentinel-entrypoint.sh:ro

  sentinel-2:
    logging: *logging
    <<: *sentinel
    container_name: token-ledger-sentinel-2
    volumes:
      - sentinel2data:/data
      - ./docker/gateway/redis/sentinel.conf.template:/sentinel.conf.template:ro
      - ./docker/gateway/redis/entrypoint-sentinel.sh:/sentinel-entrypoint.sh:ro

  sentinel-3:
    logging: *logging
    <<: *sentinel
    container_name: token-ledger-sentinel-3
    volumes:
      - sentinel3data:/data
      - ./docker/gateway/redis/sentinel.conf.template:/sentinel.conf.template:ro
      - ./docker/gateway/redis/entrypoint-sentinel.sh:/sentinel-entrypoint.sh:ro

  litellm-1:
    logging: *logging
    <<: *litellm
    container_name: token-ledger-litellm-1
    ports:
      # Mo rieng tung instance de dien tap "tat 1 instance" (GD5 dong 15) va de
      # doc log cua dung mot may. Cua chinh van la load balancer o cong 4000.
      - "127.0.0.1:${LITELLM_1_PORT:-4001}:4000"

  litellm-2:
    logging: *logging
    <<: *litellm
    container_name: token-ledger-litellm-2
    ports:
      - "127.0.0.1:${LITELLM_2_PORT:-4002}:4000"

  # Cua vao duy nhat cua Gateway. Chia luot round-robin; loai instance hong khoi
  # vong bang cach dem loi that - nginx ban mo nguon khong co health check chu
  # dong (xem chu thich trong docker/gateway/nginx.conf).
  gateway-lb:
    logging: *logging
    image: nginx:1.27-alpine
    container_name: token-ledger-gateway-lb
    profiles: ["gateway"]
    restart: unless-stopped
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # CHU Y: moi truong DO (tools/probe-gateway) cung dung cong 4000.
      # Khong bat dong thoi ca hai.
      - "127.0.0.1:${GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4000/lb-health | grep -q lb-ok"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      litellm-1:
        condition: service_healthy
      litellm-2:
        condition: service_healthy

# Khai ro dai mang de gan duoc IP TINH cho hai Redis.
#
# VI SAO CAN: Sentinel giam sat master bang dia chi. Neu dia chi la TEN service,
# thi luc container do chet, DNS cua Docker khong con phan giai duoc ten nua ->
# sentinel bao "Failed to resolve hostname 'redis'" lien tuc roi vao +tilt (che
# do tu khoa khi nghi ngo bat thuong), va o tilt thi no KHONG chuyen vai.
# Do duoc 07/09/2026: giet redis xong, sentinel thay s_down nhung dung im.
#
# Dai giu NGUYEN 172.20.0.0/16 nhu Docker da tu cap, va TEN mang khong doi
# (token-ledger-dashboard_default) -- rang buoc `external` trong compose cua DMS
# van tro dung.
#
# Hai IP dat o .250.x, xa vung Docker tu cap (bat dau tu .0.2), de khong dung do.
networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pgdata:
  pgadmin:
  redisdata:
  redisreplicadata:
  # Moi sentinel mot volume rieng: no tu viet lai file cau hinh cua chinh no,
  # dung chung la ba tien trinh giam len nhau.
  sentinel1data:
  sentinel2data:
  sentinel3data:
