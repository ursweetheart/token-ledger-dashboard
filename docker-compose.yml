name: token-ledger

x-api-image: &api-image
  image: token-ledger-api:${APP_TAG:-local}
  build:
    context: .
    dockerfile: docker/api.Dockerfile

x-dsn: &dsn postgresql://${PGUSER:-token}:${PGPASSWORD:?Set PGPASSWORD in .env}@postgres:5432/${PGDATABASE:-token_ledger}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-token_ledger}
      POSTGRES_USER: ${PGUSER:-token}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-token} -d ${PGDATABASE:-token_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      TOKEN_LEDGER_DSN: *dsn
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  gateway:
    image: token-ledger-gateway:${APP_TAG:-local}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  db-import:
    <<: *api-image
    profiles: ["tools"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-token_ledger}
      PGUSER: ${PGUSER:-token}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    command: ["python", "scripts/copy_to_postgres.py", "--nguon", "/import/token_ledger.sqlite"]
    volumes:
      - type: bind
        source: ${SQLITE_SOURCE:-./var/token_ledger.sqlite}
        target: /import/token_ledger.sqlite
        read_only: true
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  db-audit:
    <<: *api-image
    profiles: ["tools"]
    restart: "no"
    environment:
      TOKEN_LEDGER_DSN: *dsn
    command:
      - python
      - scripts/audit_db.py
      - --db
      - *dsn
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  data:
    internal: true

volumes:
  pgdata:
  pgadmin:
