# Load balancer dung truoc cac instance LiteLLM.  Master Plan GD2 dong 8, GD5 dong 15.
#
# Nginx ban mo nguon KHONG co health check chu dong. Co che loai instance hong o
# day la BI DONG: nginx dem loi that khi chuyen tiep, du max_fails thi ngung goi
# instance do trong fail_timeout. Nghia la mot vai request dau tien sau khi mot
# instance chet van roi vao no.
#
# DINH CHINH 27/08/2026 -- ban dau o day ghi "proxy_next_upstream ban tiep sang
# instance con lai nen nguoi dung khong thay loi". Chi DUNG MOT NUA:
#
#   instance CHET han (connection refused)  -> loi truoc khi gui than request
#                                              -> nginx ban sang instance kia  OK
#   instance SONG nhung tra 503             -> than request DA gui roi
#                                              -> nginx KHONG gui lai POST
#                                              -> nguoi dung nhan thang 503
#
# Vi `non_idempotent` co y khong duoc bat (xem chu thich o proxy_next_upstream),
# `http_502/503/504` gan nhu khong bao gio kich hoat cho POST /v1/chat/completions
# -- tuc cho toan bo luu luong that. Chung chi con tac dung voi GET.
#
# He qua cho bai dien tap GD5 dong 15: `docker stop litellm-2` se DAT, nhung dat
# vi ly do khac voi ly do ta tuong. No khong chung minh duoc truong hop instance
# song ma hong. Muon do truong hop do thi phai lam LiteLLM tra 5xx that.

# HAI LUAT CU DA DOI tu 17/09/2026, ca hai deu do lai bang phep do, khong suy dien.
#
# Ban truoc cua chu thich nay ghi: nginx TU CHOI khoi dong neu mot ten upstream
# khong ra dia chi ("host not found in upstream"), nen bai dien tap "tat 1 instance"
# (GD5 dong 15) co hai he qua:
#   - tat mot instance khi nginx DANG chay  -> nginx song, loai instance do, dat.
#   - khoi dong lai nginx khi mot instance DANG tat -> nginx KHONG len duoc.
#
# He qua thu hai KHONG CON DUNG sau khi them `resolve`: tham so do chuyen viec phan
# giai sang LUC CHAY, nen nginx khong con doi moi ten phai ra dia chi luc khoi dong.
# Do 17/09/2026: tat `litellm-2` roi restart `gateway-lb` -> gateway-lb LEN BINH
# THUONG va van phuc vu qua instance con lai (`/health/readiness` tra 200).
#
# Day la mot bay BI GO BO, khong phai mot rui ro moi. `depends_on` cua gateway-lb
# van giu nguyen -- doi ca hai instance khoe la khoi dong sach se, chi khong con la
# DIEU KIEN BAT BUOC de nginx len duoc nua.
#
# TRUOC 17/09/2026 con mot he qua thu ba, KHONG duoc ghi ra: nginx phan giai
# ten upstream MOT LAN luc khoi dong roi giu nguyen dia chi do mai mai. Instance
# nao doi IP la bien mat khoi vong chia tai, IM LANG.
#
# Do duoc 17/09/2026, ep IP doi mot bac (.8 -> .9):
#     litellm-1    0 / 20 luot      <- bien mat han
#     litellm-2   20 / 20 luot
#     cung luc:   ca ba container `healthy`, /lb-health tra `lb-ok`
# Mat mot nua nang luc xu ly ma KHONG mot dau hieu be mat nao lech.
#
# Dieu kien kich hoat thi hep: dung lai container KHONG tu no doi IP -- Docker cap
# lai dung dia chi cu khi no con trong, do 3 lan, ke ca khi dung lai ca hai
# instance cung luc. Chi kich hoat khi dia chi cu BI CONTAINER KHAC GIANH MAT. Duong
# do co that: compose cua DMS tro vao chinh mang nay bang rang buoc `external`
# (xem khoi `networks:` cuoi docker-compose.yml).
#
# `resolver` + `zone` + `resolve` keep recreated instances in rotation.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway_status {
    zone gateway_status 64k;
    server gateway-status:8089 resolve;
}

upstream litellm_pool {
    # BAT BUOC di kem `resolve`: tham so do doi upstream nam trong vung nho chung.
    # Thieu `zone` thi nginx bao loi cau hinh va khong khoi dong.
    zone litellm_pool 64k;

    # Khong khai chien luoc nao = round-robin, dung yeu cau cua ke hoach.
    # `resolve` = hoi lai DNS theo chu ky `valid=10s` o tren, thay vi ghim dia chi
    # da phan giai luc khoi dong.
    server litellm-1:4000 resolve max_fails=2 fail_timeout=30s;
    server litellm-2:4000 resolve max_fails=2 fail_timeout=30s;

    # Giu ket noi song, khoi bat tay TCP lai tung request.
    keepalive 32;
}

# Them 18/09/2026: gateway-lb tu ket thuc TLS tren 4443 (publish ra host qua
# LLM_GATEWAY_TLS_PORT, mac dinh 443), SONG SONG voi HTTP thuong tren 4000 --
# khong thay the, chi them. Cert wildcard *.rangdong.com.vn that (Sectigo),
# het han 27/11/2026 -- xem docker/gateway/tls/README.md de biet cach gia han.
ssl_certificate     /etc/nginx/tls/apigateway.crt;
ssl_certificate_key /etc/nginx/tls/apigateway.key;
ssl_protocols       TLSv1.2 TLSv1.3;

map $http_x_forwarded_proto $gateway_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 4000 default_server;
    server_name _;
    return 444;
}

server {
    listen 4000;
    listen 4443 ssl;
    server_name ${LLM_GATEWAY_DOMAIN} gateway-lb token-ledger-gateway-lb localhost 127.0.0.1 192.168.20.111;

    # Header danh tinh KHONG duoc rot o day. Nginx mac dinh BO header co gach duoi
    # trong ten -- bat len de mot header ten kieu `x_user` cung di qua nguyen ven.
    underscores_in_headers on;

    # Prompt kem anh / tep vuot xa mac dinh 1m.
    client_max_body_size 25m;

    # Model suy luan tra cham. Mac dinh 60s se cat ngang cuoc goi dang chay --
    # va cat o day thi Gateway ghi mot request that bai cho mot cuoc goi that su
    # da thanh cong va DA bi tinh tien ben Google.
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Cua kiem cho RIENG load balancer: tra loi ngay, khong cham toi upstream.
    # Muon biet instance con song thi goi /health/liveliness (di qua upstream).
    location = /lb-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "lb-ok\n";
    }

    # Compatibility liveness endpoint: no upstream/provider readiness implied.
    location = /edge-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "edge-ok\n";
    }

    # Explicit read-only web allowlist. ACL uses the TCP peer, never client XFF.
    #
    # HAI dai duoc phep, khac muc dich: ADMIN_CIDR la may van hanh (thuong la
    # loopback that hoac dia chi NAT cua Docker Desktop tren chinh may chay
    # stack nay); LAN_CIDR la mang noi bo duoc phep xem trang web/status tu
    # may khac. Khong gop chung thanh MOT bien vi hai dai IP nay khac nhau,
    # va thu hep tung dai rieng de kiem soat de hon nguoi duoc xem.
    location ~ ^/(app\.js|style\.css|api/status)?$ {
        allow 127.0.0.1;
        allow ::1;
        allow ${LLM_GATEWAY_ADMIN_CIDR};
        allow ${LLM_GATEWAY_LAN_CIDR};
        deny all;
        proxy_pass http://gateway_status;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
    }

    location = /gateway/v1/chat/completions {
        proxy_pass http://litellm_pool/v1/chat/completions;
    }

    location = /v1/chat/completions {
        proxy_pass http://litellm_pool;
    }

    location ~ ^/health/(liveliness|readiness)$ {
        if ($host = ${LLM_GATEWAY_DOMAIN}) { return 404; }
        proxy_pass http://litellm_pool;
    }

    location / {
        return 404;
    }

    # Shared inference policy; status overrides request headers and body above.
    # Do not replay an already-sent paid POST.

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-User            $http_x_user;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gateway_forwarded_proto;

    # Tra loi dang stream (SSE). Bat buffering la nguoi dung phai doi het cau
    # tra loi moi thay chu dau tien.
    proxy_buffering off;
    proxy_cache     off;

    # Instance hong -> ban sang instance con lai. CO Y khong them
    # `non_idempotent`: POST /v1/chat/completions gui lai la GOI PROVIDER LAN
    # HAI, tuc tra tien hai lan cho mot cau hoi. Nginx mac dinh khong thu lai
    # POST, va phai giu nguyen nhu vay.
    proxy_next_upstream       error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
}
