model_list:
  - model_name: tla-hd-mock
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: mock-not-a-provider-key
      api_base: http://127.0.0.1:9/v1
      mock_response: "gateway-smoke-ok"
      tags: [tla-hd]
  - model_name: ralli-mock
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: mock-not-a-provider-key
      api_base: http://127.0.0.1:9/v1
      mock_response: "gateway-smoke-ok"
      tags: [ralli]
  - model_name: ralli-ocr-mock
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: mock-not-a-provider-key
      api_base: http://127.0.0.1:9/v1
      mock_response: '{"form_title":"Biểu mẫu khảo sát điện áp mái","is_dam_rooftop_survey":true,"confidence":0.98,"text":"gateway-ralli-ocr-ok","fields":{"ho_ten_khach_hang":"Nguyễn Văn Test"},"unclear_fields":[]}'
      tags: [ralli]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  user_header_name: X-User
  store_prompts_in_spend_logs: true
  forward_client_headers_to_llm_api: false
litellm_settings:
  drop_params: true
  turn_off_message_logging: true
router_settings:
  enable_tag_filtering: true
  num_retries: 0
