# Test-only extension; preserves existing single-proxy smoke services.
services:
  gateway2:
    extends:
      file: compose.yaml
      service: gateway
  gateway-lb:
    image: nginx:alpine
    ports: ["127.0.0.1:4101:4000"]
    volumes:
      - ./nginx.lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, ingress]
    mem_limit: 128m
    restart: "no"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O- http://127.0.0.1:4000/lb-health"]
      interval: 3s
      timeout: 3s
      retries: 20
