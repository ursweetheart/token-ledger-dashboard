# Synthetic identities only; never log Authorization or request/response bodies.
log_format attribution escape=json '{"user":"$http_x_user","path":"$uri","status":$status,"upstream":"$upstream_addr","upstream_status":"$upstream_status","seconds":$request_time}';
upstream litellm_pool {
    server gateway:4000 max_fails=2 fail_timeout=5s;
    server gateway2:4000 max_fails=2 fail_timeout=5s;
    keepalive 32;
}
server {
    listen 4000;
    client_max_body_size 25m;
    access_log /var/log/nginx/attribution.jsonl attribution;
    location = /lb-health {
        access_log off;
        return 200 'lb-ok\n';
    }
    location / {
        proxy_pass http://litellm_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-User $http_x_user;
        proxy_connect_timeout 2s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
