# Chạy mọi phép kiểm của repo trên mỗi lần đẩy code.
#
# Ba nhóm kiểm chạy SONG SONG vì chúng độc lập: hỏng nhóm nào biết ngay nhóm đó,
# không phải đợi nhau. Xem openspec/changes/run-every-check-on-every-push/.
# Nhóm thứ tư, `gateway-image`, đóng gói image Gateway. Nó không chạy ở pull
# request. Xem openspec/changes/package-the-gateway-image-in-ci/.
#
# KHÔNG có bước cài gói ở bất kỳ nhóm nào, và đó là CÓ Ý:
#   - repo không có package.json, pytest.ini, pyproject.toml, setup.cfg
#   - phần JavaScript dùng bộ chạy kiểm có sẵn của Node
#   - psycopg2 được nạp bên trong hàm (db/connect.py:196), không ở đầu tệp
# Đã đo 16/09/2026 trong container trắng: python:3.12-slim đạt 58/58 và
# node:24-alpine đạt 53/53, không cài gói nào. Máy ảo ở đây dựng lại đúng
# môi trường đó, nên nếu có ai làm mất tính chất này thì nó đỏ ngay.

name: CI

on:
  push:
    branches: [main, Tuan-develop]
  pull_request:
    branches: [main]
  # Bấm tay trên tab Actions: dùng khi fork vừa có commit mới mà repo này không đổi.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Canh cấu hình. Nhóm rẻ nhất, và là nhóm bắt đúng lỗi đã thật sự xảy ra:
  # ngày 12/09 địa chỉ bind của `web` bị để ở chế độ máy phát triển.
  # ---------------------------------------------------------------------------
  guards:
    name: Canh cấu hình
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nguyên tắc, không phải một địa chỉ cụ thể: 127.0.0.1 an toàn ở mọi máy
      # vì nó luôn tồn tại và luôn nghĩa là "chỉ máy này". Mọi IP khác đều là
      # địa chỉ của MỘT môi trường, nên nó thuộc về .env chứ không thuộc về git.
      - name: Không IP nào của một môi trường được ghi cứng ở phần khai cổng
        run: |
          BAD=$(grep -nE '^[[:space:]]*-[[:space:]]*"([0-9]{1,3}\.){3}[0-9]{1,3}:' \
                  docker-compose.yml docker-compose.bench.yml \
                | grep -v '"127\.0\.0\.1:' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::Có địa chỉ IP của một môi trường cụ thể nằm trong tệp theo git (xem dòng ở trên)."
            echo "::error::Đưa nó ra biến môi trường và khai trong .env, ví dụ WEB_BIND. Xem .env.example."
            exit 1
          fi
          echo "Không có IP ghi cứng nào ngoài 127.0.0.1."

      # Chiều ngược lại của cùng một lỗi: quay về ghi cứng 127.0.0.1 thì máy chủ
      # mất đường vào, và lần đó CI sẽ im nếu chỉ có phép kiểm ở trên.
      - name: Địa chỉ bind của `web` phải đọc từ biến
        run: |
          if ! grep -qE '^[[:space:]]*-[[:space:]]*"\$\{WEB_BIND' docker-compose.yml; then
            grep -nE '^[[:space:]]*-[[:space:]]*".*:80"$' docker-compose.yml || true
            echo '::error::docker-compose.yml: cổng của dịch vụ web không còn đọc địa chỉ từ biến WEB_BIND.'
            # Nháy đơn là CÓ Ý: thông điệp phải in ra chữ ${WEB_BIND} nguyên văn
            # để người đọc chép được, chứ không phải giá trị của nó.
            # shellcheck disable=SC2016
            echo '::error::Phải là:  - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"  — máy chủ đặt WEB_BIND trong .env.'
            exit 1
          fi
          echo "Dịch vụ web bind qua biến WEB_BIND."

      # Gateway chạy image lấy từ kho (package-the-gateway-image-in-ci). Quay lại
      # build từ thư mục ngang hàng thì máy nào thiếu thư mục đó, compose thoát
      # ngay và kéo theo cả postgres, api, web. Bench phải ghim đúng cùng image:
      # đo tải trên một image khác image đang chạy thì số đo vô nghĩa.
      - name: Gateway image must come from the registry, not a sibling folder
        run: |
          BLOCK=$(awk '/^x-litellm:/{f=1; next} f && /^[^[:space:]#]/{exit} f' docker-compose.yml)
          if printf '%s\n' "$BLOCK" | grep -nE '^[[:space:]]+(build|context):'; then
            echo "::error::docker-compose.yml: x-litellm must not build (build:/context:). Use  image: \${LITELLM_IMAGE:-<registry tag>}"
            exit 1
          fi
          MAIN=$(printf '%s\n' "$BLOCK" | sed -nE 's/^[[:space:]]+image:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p')
          BENCH=$(awk '/^  litellm-bench:/{f=1; next} f && /^(  )?[^[:space:]#]/{exit} f' docker-compose.bench.yml \
                  | sed -nE 's/^[[:space:]]+image:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p')
          if [ -z "$MAIN" ] || [ "$MAIN" != "$BENCH" ]; then
            echo "::error::Gateway image mismatch: docker-compose.yml x-litellm has '$MAIN', docker-compose.bench.yml litellm-bench has '$BENCH'."
            exit 1
          fi
          echo "Gateway image comes from the registry: $MAIN"

      # Dynamic Docker DNS keeps recreated instances in the LB rotation.
      # Đo được 17/09/2026, ép IP đổi một bậc khi chưa có `resolve`:
      #     litellm-1    0 / 20 lượt      <- biến mất hẳn
      #     litellm-2   20 / 20 lượt
      # Mất một nửa năng lực xử lý, không một dấu hiệu bề mặt nào lệch.
      #
      # Canh theo TÍNH CHẤT, không theo tên tệp: khối `upstream` thêm sau cũng bị
      # xét. Dòng `server` trỏ bằng ĐỊA CHỈ IP thì không bị đòi `resolve` — nó
      # không phụ thuộc DNS.
      - name: Every upstream that points by name must re-resolve
        run: |
          STATUS=0
          for f in docker/gateway/*.conf docker/gateway/*.conf.template; do
            [ -e "$f" ] || continue
            # Chuẩn hoá trước khi đọc: bỏ chú thích, tách { } ; ra dòng riêng.
            # Không có bước này thì khối upstream viết gọn trên MỘT dòng lọt hết.
            NORM=$(sed -e 's/#.*//' "$f" | tr -d '\r' \
                   | sed -e 's/{/{\n/g' -e 's/}/\n}\n/g' -e 's/;/;\n/g')
            OUT=$(printf '%s\n' "$NORM" | awk '
              /^[[:space:]]*upstream[[:space:]]+[A-Za-z0-9_]+[[:space:]]*\{/ { inb=1; zone=0; n=0; next }
              inb && /^[[:space:]]*\}/ {
                if (n > 0 && zone == 0) print "  missing zone in an upstream block that points by name"
                total += n; inb = 0; next
              }
              inb && /^[[:space:]]*zone[[:space:]]/ { zone = 1 }
              inb && /^[[:space:]]*server[[:space:]]+[A-Za-z][A-Za-z0-9_.-]*:[0-9]+/ {
                n++
                if ($0 !~ /[[:space:]]resolve([[:space:];]|$)/) print "  missing resolve:" $0
              }
              END {
                if (inb && n > 0 && zone == 0) print "  missing zone in an upstream block that points by name"
                print "NAMES=" total + (inb ? n : 0)
              }
            ')
            NAMES=$(printf '%s\n' "$OUT" | sed -n 's/^NAMES=//p')
            PROB=$(printf '%s\n' "$OUT" | grep -v '^NAMES=' || true)
            if [ "${NAMES:-0}" -gt 0 ] && ! grep -qE '^[[:space:]]*resolver[[:space:]]' "$f"; then
              PROB="$PROB
            no resolver directive, but this file has an upstream that points by name"
            fi
            if [ -n "$(printf '%s' "$PROB" | tr -d '[:space:]')" ]; then
              echo "$f"; printf '%s\n' "$PROB"; STATUS=1
            fi
          done
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::An upstream pointing by name needs: a resolver directive in the file, a zone in the block, and resolve on each server line."
            echo "::error::Copy the pattern from docker/gateway/nginx.conf. Without it, an instance that changes IP silently drops out of rotation."
            exit 1
          fi
          echo "Every upstream pointing by name re-resolves."

      # Phép canh này bắt đúng sự cố 10/09/2026. Hôm đó tên một biến khoá đổi ở
      # .env nhưng config.gateway.yaml và docker-compose.yml vẫn giữ tên cũ. Vì
      # compose viết ${VAR:-}, dấu :- biến một biến THIẾU thành CHUỖI RỖNG thay vì
      # một lỗi — nên container lên bình thường, /health/liveliness trả 200, mọi
      # phép kiểm đạt, và tuyến CRM chỉ chết đúng lúc có người gọi thật
      # (HTTP 500 "Missing Gemini API key").
      #
      # Cửa chặn ở docker/gateway/entrypoint.sh chỉ bảo vệ được những biến NÓ BIẾT
      # TÊN. Hôm ấy danh sách thiếu đúng khoá CRM, trong khi chú thích ở
      # docker-compose.yml đã ghi là có — nên không ai soát lại.
      #
      # docker-compose.bench.yml phải có mặt trong luật này: bench dùng CHUNG cửa
      # chặn ấy, nên thêm một biến vào vòng kiểm mà quên cấp giá trị thay thế ở
      # bench thì phần đo không khởi động được.
      - name: Every provider key the gateway config uses must be declared everywhere
        run: |
          CFG=docker/gateway/config.gateway.yaml
          ENTRY=docker/gateway/entrypoint.sh
          COMPOSE=docker-compose.yml
          BENCH=docker-compose.bench.yml
          STATUS=0

          # Khoá ghi thẳng vào tệp cấu hình = bí mật nằm trong git.
          LIT=$(grep -nE '^[[:space:]]*api_key:' "$CFG" | grep -v 'os\.environ/' || true)
          if [ -n "$LIT" ]; then
            echo "$LIT"
            echo "::error::$CFG: api_key must reference an environment variable (os.environ/NAME), never a literal value."
            STATUS=1
          fi

          REQ=$(sed -n 's/^for v in \(.*\); do$/\1/p' "$ENTRY")
          for k in $(grep -oE 'api_key:[[:space:]]*os\.environ/[A-Z_][A-Z0-9_]*' "$CFG" \
                     | sed -E 's|.*os\.environ/||' | sort -u); do
            case " $REQ " in *" $k "*) ;; *)
              echo "::error::$k is used by $CFG but missing from the required-vars loop in $ENTRY."
              STATUS=1 ;;
            esac
            grep -qE "^[[:space:]]+$k:[[:space:]]*\\\$\{$k" "$COMPOSE" || {
              echo "::error::$k is used by $CFG but not passed to the container in $COMPOSE (x-litellm environment)."
              STATUS=1; }
            grep -qE "^[[:space:]]+$k:" "$BENCH" || {
              echo "::error::$k is used by $CFG but has no stand-in value in $BENCH; bench shares the same startup gate and will not come up."
              STATUS=1; }
          done

          [ "$STATUS" -ne 0 ] && exit 1
          echo "Every provider key referenced by the gateway config is declared in all three places."

  # ---------------------------------------------------------------------------
  # 53 phép kiểm JavaScript. Node có sẵn trên máy ảo, không cài gì thêm.
  # ---------------------------------------------------------------------------
  test-js:
    name: Phép kiểm JavaScript
    runs-on: ubuntu-latest
    env:
      # Mốc đo 16/09/2026. Thêm hoặc bớt phép kiểm có chủ ý thì sửa số này —
      # con số đổi trong lịch sử git chính là chỗ nhìn thấy việc đó.
      EXPECTED_JS: "81"
    steps:
      - uses: actions/checkout@v4

      - name: Phiên bản Node đang dùng
        run: node --version

      # Mã thoát bằng 0 KHÔNG đủ làm bằng chứng: nếu mẫu tên tệp nở hụt thì lệnh
      # vẫn có thể thoát sạch mà không kiểm gì. Nên phải đọc số phép đã chạy.
      # Cùng nguyên tắc mà automated-check-coverage đã chốt cho bộ kiểm dữ liệu.
      - name: Chạy và đếm số phép kiểm
        run: |
          # GHI RA TỆP RỒI `cat`, KHÔNG dùng `| tee`. GitHub chạy khối run bằng
          # `bash -e`, KHÔNG có `pipefail` — nên mã thoát của một đường ống là mã
          # thoát của lệnh CUỐI, tức của `tee`, mà `tee` thì luôn thành công.
          # Hậu quả đã đo 13/09/2026: phép kiểm TRƯỢT mà nhóm này vẫn XANH.
          # Bỏ đường ống đi thì cả loại lỗi đó biến mất, không cần nhớ cờ nào.
          node --test tests/*.test.js > js.log 2>&1 || RC=$?
          cat js.log
          # NF>=2 BẮT BUỘC phải có: gặp dòng trống thì NF=0 và $(NF-1) thành
          # $(-1), gawk chết ngay với "attempt to access field -1". Báo cáo của
          # một phép kiểm TRƯỢT có dòng trống, nên thiếu điều kiện này thì bộ đếm
          # sập đúng lúc cần nó nhất, và nhóm đỏ vì awk chứ không vì thông điệp.
          # Đo 13/09/2026, lộ ra khi chạy thử chiều đỏ chứ không phải chiều xanh.
          COUNT=$(awk 'NF>=2 && $(NF-1)=="tests"{n=$NF} END{print n+0}' js.log)
          echo "Đã chạy $COUNT phép kiểm, mốc chốt là $EXPECTED_JS."
          if [ "$COUNT" -ne "$EXPECTED_JS" ]; then
            echo "::error::Số phép kiểm JavaScript là $COUNT, mốc chốt là $EXPECTED_JS."
            echo "::error::Nếu việc đổi là có chủ ý, sửa EXPECTED_JS trong .github/workflows/ci.yml."
            echo "::error::Nếu không, mẫu tên tệp có thể đã nở hụt và không phép nào được chạy."
            exit 1
          fi
          exit "${RC:-0}"

  # ---------------------------------------------------------------------------
  # 11 phép kiểm Python. Không pip install — xem ghi chú đầu tệp.
  # ---------------------------------------------------------------------------
  test-py:
    name: Phép kiểm Python
    runs-on: ubuntu-latest
    env:
      # Mốc đo 14/09/2026: 11 → 37 sau change stop-a-later-pull-from-shrinking-an-earlier-one
      # (bỏ 2 phép kiểm rebuild cũ, thêm 6 phép kiểm rebuild, 9 gộp Monitoring,
      # 9 gộp độ trễ, 4 nạp nhà cung cấp).
      # Mốc đo 15/09/2026: 37 → 58, thêm 21 phép kiểm của tools/check_english_names.py
      # (change name-the-code-in-english). Lần đẩy e3a214b đỏ vì quên sửa số này.
      # Mốc đo 18/09/2026: 71 → 85, thêm 14 phép kiểm của gateway-watch (mốc bắt đầu sự cố,
      # nội dung thư DOWN, chẩn đoán một dòng, công tắc nhịp tim). Lần đẩy 021856f đỏ vì
      # quên sửa số này — lần thứ hai cùng một lý do.
      EXPECTED_PY: "85"
      # Kết xuất phép kiểm có tiếng Việt có dấu. Thiếu biến này thì ở một số
      # môi trường tiến trình chết giữa chừng khi in ra bảng mã không đỡ nổi.
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Phiên bản Python đang dùng
        run: python3 --version

      # Nếu bước này đỏ vì THIẾU GÓI thì đừng thêm pip install để vá. Nó có
      # nghĩa là tính chất "chạy được mà không cài gì" đã mất, và điều cần biết
      # là tệp nào làm mất. Xem Requirement "Bộ kiểm phải chạy được trên một
      # máy sạch, không cài thêm gói".
      - name: Chạy và đếm số phép kiểm
        run: |
          # Cùng lý do với nhóm JavaScript: không dùng `| tee`, vì `bash -e` của
          # GitHub không bật `pipefail` và mã thoát sẽ là của `tee`, luôn bằng 0.
          python3 -m unittest discover -s tests -p "test_*.py" > py.log 2>&1 || RC=$?
          cat py.log
          COUNT=$(awk '$1=="Ran"{n=$2} END{print n+0}' py.log)
          echo "Đã chạy $COUNT phép kiểm, mốc chốt là $EXPECTED_PY."
          if [ "$COUNT" -ne "$EXPECTED_PY" ]; then
            echo "::error::Số phép kiểm Python là $COUNT, mốc chốt là $EXPECTED_PY."
            echo "::error::Nếu việc đổi là có chủ ý, sửa EXPECTED_PY trong .github/workflows/ci.yml."
            exit 1
          fi
          exit "${RC:-0}"

  # ---------------------------------------------------------------------------
  # Đóng gói image LiteLLM từ fork và đẩy lên GHCR, nhãn = commit của fork.
  # Chỉ job này có quyền ghi gói. Không chạy ở pull request, vì code chưa được
  # duyệt thì không được cầm quyền đó.
  # ---------------------------------------------------------------------------
  gateway-image:
    name: Gateway image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Hai lần đẩy sát nhau cùng thấy nhãn chưa có thì cùng build, và lần sau ghi
    # đè lần trước bằng một bản build khác. Xếp hàng thì lần sau thấy nhãn đã có.
    concurrency:
      group: gateway-image
      cancel-in-progress: false
    env:
      FORK_URL: https://github.com/ursweetheart/litellm_rang_dong
      FORK_BRANCH: Tuan-develop
      IMAGE_REPO: ghcr.io/ursweetheart/litellm_rang_dong
      PATCH_FILE: litellm/_redis.py
      PATCH_SYMBOL: _SENTINEL_IGNORED_CONNECTION_ARGS
    steps:
      - uses: actions/checkout@v4

      # D2: không ghim commit ở đây. Commit được đọc SAU khi clone; chỗ quyết định
      # image nào chạy là nhãn ghim trong docker-compose.yml.
      - name: Clone the fork
        run: |
          git clone --quiet --depth 1 --branch "$FORK_BRANCH" "$FORK_URL.git" fork
          FORK_COMMIT=$(git -C fork rev-parse HEAD)
          echo "FORK_COMMIT=$FORK_COMMIT" >> "$GITHUB_ENV"
          echo "Fork $FORK_BRANCH is at $FORK_COMMIT."

      # D3: thiếu bản vá thì LiteLLM chết lúc khởi động. Canh TRƯỚC khi build, để
      # không có image hỏng nào lên kho. Đo 14/09/2026: nhánh
      # litellm_internal_staging của fork không có bản vá.
      - name: Require the Sentinel patch
        run: |
          if ! grep -q "$PATCH_SYMBOL" "fork/$PATCH_FILE" 2>/dev/null; then
            echo "::error::Sentinel patch missing: $PATCH_SYMBOL not found in $PATCH_FILE."
            echo "::error::Fork $FORK_URL, branch $FORK_BRANCH, commit $FORK_COMMIT."
            echo "::error::Without it LiteLLM exits at startup with: Redis.__init__() got multiple values for argument 'host'."
            exit 1
          fi
          echo "Sentinel patch present in $PATCH_FILE."

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # D4: GHCR không tự cấm ghi đè nhãn; bước này là thứ giữ nhãn bất biến.
      # "Chưa có" là một trong các câu trả lời sau. Đo trên GHCR thật 15/09/2026:
      #   manifest unknown  gói có, nhãn không có
      #   denied            gói chưa từng tồn tại, tức là lần build ĐẦU TIÊN
      # Coi denied/unauthorized là "chưa có" vẫn không ghi đè được nhãn nào:
      # không đọc được gói thì cũng không đẩy được vào gói, `docker push` sẽ hỏng.
      # Lỗi khác (mạng, kho quá tải) thì dừng, không đoán.
      - name: Skip if this commit is already packaged
        run: |
          IMAGE="$IMAGE_REPO:$FORK_COMMIT"
          if OUT=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
            echo "::notice::Skipping build: $IMAGE is already in the registry."
          elif printf '%s' "$OUT" | grep -qiE 'no such manifest|manifest unknown|denied|unauthorized'; then
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
            echo "$IMAGE is not in the registry yet (registry said: $(printf '%s' "$OUT" | head -1)), building it."
          else
            echo "$OUT"
            echo "::error::Could not tell whether $IMAGE exists. Refusing to build, so an existing tag is never overwritten."
            exit 1
          fi

      # D4: nhãn OCI trả lời "build từ đâu" bằng `docker inspect` ngay trên máy chủ.
      # `source` trỏ về REPO NÀY chứ không về fork: GHCR dùng nhãn đó để gắn gói
      # vào repo, mà GITHUB_TOKEN chỉ đẩy được vào gói gắn với repo chạy workflow.
      # Địa chỉ fork nằm ở `url`, commit fork ở `revision`.
      # Dung lượng đĩa và thời gian được in ra để đo lần build đầu (task 2.7).
      - name: Build and push
        if: env.IMAGE_EXISTS == 'false'
        run: |
          IMAGE="$IMAGE_REPO:$FORK_COMMIT"
          echo "Disk free before build: $(df -h / | awk 'NR==2{print $4}')"
          START=$(date +%s)
          docker build \
            --label "org.opencontainers.image.revision=$FORK_COMMIT" \
            --label "org.opencontainers.image.url=$FORK_URL" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" fork
          echo "Build took $(( $(date +%s) - START ))s."
          echo "Disk free after build: $(df -h / | awk 'NR==2{print $4}')"
          docker image ls "$IMAGE" --format 'Image size: {{.Size}}'
          docker push "$IMAGE"

      # D7: compose phải ghim một nhãn có thật trên kho. Đổi phiên bản vì thế luôn
      # theo thứ tự: commit fork -> CI build nhãn -> commit sửa nhãn trong compose.
      # Khi x-litellm còn `build:` (trước nhóm 5) thì chưa có gì để kiểm.
      - name: Compose must pin a tag that exists
        run: |
          BLOCK=$(awk '/^x-litellm:/{f=1; next} f && /^[^[:space:]#]/{exit} f' docker-compose.yml)
          if printf '%s\n' "$BLOCK" | grep -qE '^[[:space:]]+build:'; then
            echo "::notice::x-litellm still builds from a sibling folder; no registry tag to check yet."
            exit 0
          fi
          PINNED=$(printf '%s\n' "$BLOCK" | sed -nE 's/^[[:space:]]+image:[[:space:]]*"?\$\{LITELLM_IMAGE:-([^}]+)\}"?[[:space:]]*$/\1/p')
          if [ -z "$PINNED" ]; then
            echo "::error::docker-compose.yml: x-litellm must read  image: \${LITELLM_IMAGE:-<registry tag>}"
            exit 1
          fi
          if ! docker manifest inspect "$PINNED" > /dev/null; then
            echo "::error::docker-compose.yml pins $PINNED, which is not in the registry."
            exit 1
          fi
          echo "docker-compose.yml pins $PINNED, which is in the registry."
