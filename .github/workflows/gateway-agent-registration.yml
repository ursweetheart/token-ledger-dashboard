name: Gateway agent registration
on:
  push:
    branches: [main, Tuan-develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding_test
          POSTGRES_DB: onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d onboarding_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GATEWAY_ONBOARDING_TEST_DSN: postgresql://onboarding:onboarding_test@127.0.0.1:5432/onboarding_test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python -m pytest -p no:cacheprovider tests/gateway_registration_cases.py tests/test_directory_account_lookup.py tests/test_load_gateway_identity.py -q
      - run: node --test tests/gateway-identities.test.js
