name: Gateway connection integration fixture
on:
  workflow_dispatch:
jobs:
  isolated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONNECTION_TEST_DSN: postgresql://connection_test:isolated-test-only@127.0.0.1:55439/connection_ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: docker compose -f tests/gateway-connections/compose.yaml up -d
      - run: python tests/gateway-connections/setup_ledger.py
      - run: python tests/gateway-connections/probe.py
      - run: python -m pytest tests/connection_config_cases.py tests/connection_auth_cases.py tests/connection_admin_cases.py tests/connection_migration_cases.py -q
      - if: always()
        run: docker compose -f tests/gateway-connections/compose.yaml down -v
